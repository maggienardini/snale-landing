<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snale</title>
<meta name="description" content="Snale is a social app for artists, with no AI in it. Join the waitlist.">
<meta name="theme-color" content="#DEF6CA">
<meta property="og:type" content="website">
<meta property="og:title" content="Snale">
<meta property="og:description" content="A social app for artists, with no AI in it. Join the waitlist.">
<link rel="icon" type="image/png" href="img/snail.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* Layout: an opening where the logo draws itself and then shrinks into the header, then one idea per screen down a
tea-green page while the snail crawls a winding path behind the words and leaves a shiny trail. */
/* Tea green is the ground, lavender only for small cards, Yale blue for text and buttons. The ground is a living scene that follows the time of day (see the world script at the end). */
:root{
  --tea:#DEF6CA; --blue:#0B4F6C; --berry:#9D3E7F; --orange:#F68A4C; --lav:#F5E5FC; --white:#FFFFFF;
  --muted:#3F6A6E; --line:#BFE0A6; --water:#B5D7DF; --block:#CDEBB5; --park:#C2E5A2; --orange2:#F45321;
  --f:"DM Sans","Segoe UI",system-ui,sans-serif;
  --f-head:"Italiana","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--tea);color:var(--blue);font-family:var(--f);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.intro-on{overflow:hidden}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-head)}
h1,h2{font-weight:560;letter-spacing:-.05em;line-height:.98;text-wrap:balance}
:focus-visible{outline:2.5px solid var(--berry);outline-offset:3px}
button,input{font:inherit;color:inherit}
.in{max-width:1040px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}

/* opening */
.intro{position:fixed;inset:0;z-index:50;background:var(--tea);display:grid;place-items:center;transition:background-color .9s ease .2s}
.intro.leaving{background:rgba(222,246,202,0);pointer-events:none}
.intro-logo{width:min(680px,84vw);transform-origin:0 0;transition:transform 1.15s cubic-bezier(.65,0,.25,1)}
.logo-draw{width:100%;height:auto;display:block}
.skip{position:fixed;right:max(18px, env(safe-area-inset-right, 0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:51;border:1.5px solid var(--blue);background:var(--tea);padding:7px 12px;font-size:14px;font-weight:500;cursor:pointer;border-radius:0}
.intro.leaving + .skip{display:none}

/* header */
header{position:relative;z-index:3}
header .in{display:flex;justify-content:space-between;align-items:center;padding-block:20px}
.hlogo{height:38px;width:auto;display:block;visibility:hidden}
.hlogo.on{visibility:visible}
.btn{border:0;border-radius:8;background:var(--blue);color:var(--white);padding:13px 20px;font-weight:500;font-size:15.5px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{background:var(--berry)}
.btn.small{padding:9px 14px;font-size:16.5px}

header .in{justify-content:center}
/* header .in{padding-bottom:clamp(32px,8vh,96px)} */

/* the trail sits behind everything you read */
main{position:relative}
.trail{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:0;overflow:visible}
.trail path{fill:none;stroke:none}
/* the trail is laid in soft, uneven dabs, wet when laid and drying paler over a few seconds */
.trail ellipse{fill:#FFFFFF;transition:opacity 9s ease-out}
/* on the white map a white trail wouldn't show, so there it's a faint wet blue */
#townDabs ellipse{fill:var(--blue)}
.crawler{position:absolute;left:0;top:0;width:86px;height:auto;z-index:1;pointer-events:none;will-change:transform;opacity:0;transition:opacity .6s;transform-origin:50% 92%;filter:url(#boil)}
.crawler.on{opacity:1}
section{position:relative;z-index:2}

/* one idea per screen */
.idea{min-height:92vh;display:grid;align-content:center;gap:24px;padding-block:80px}
.idea h2,.hero h1{font-size:clamp(50px,9.5vw,128px)}
.idea p,.hero p{font-size:clamp(18px,1.9vw,23px);max-width:40ch;color:var(--muted)}
.kick{font-size:16.5px;font-weight:560;color:var(--orange2)}
.zoom{transform-origin:0 60%;will-change:transform}
.idea h2.long{font-size:clamp(40px,7vw,92px);max-width:13ch}
.right{justify-items:end;text-align:right}
.right p{justify-self:end}

/* the map that zooms in on one place */
.mapzoom{height:260vh;position:relative}
.mapzoom .stick{position:sticky;top:0;height:100vh;display:grid;align-content:center;gap:22px}
.frame{width:min(760px,100%);aspect-ratio:8/5;max-width:100%;overflow:hidden;background:var(--white);border:1.5px solid var(--blue);position:relative;justify-self:center}
.frame svg{width:100%;height:100%;display:block;transform-origin:70% 60%;will-change:transform}
.cap{justify-self:center;text-align:center;display:grid;gap:6px;min-height:6.5em;max-width:34ch}
.cap h3{font-size:clamp(26px,3.4vw,38px);font-weight:560;letter-spacing:-.04em;line-height:1.1}
.cap p{color:var(--muted);font-size:17px}
.dist{position:absolute;left:12px;top:10px;background:var(--white);border:1.5px solid var(--blue);font-size:13px;font-weight:500;padding:3px 8px;font-variant-numeric:tabular-nums}

/* studio strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:min(760px,100%)}
.stage{background:var(--lav);padding:8px 8px 10px;display:grid;gap:6px;transform-origin:50% 80%;will-change:transform}
.stage .slot{display:block;aspect-ratio:4/3;max-width:100%;border:1.5px dashed #C9B3E6;background:#FBF4FE}
.stage small{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
@media (max-width:560px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* places list */
.places{list-style:none;margin:0;padding:0;width:min(640px,100%);border-top:1.5px solid var(--blue)}
.places li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line)}
.places .r{font-size:22px;font-weight:560;color:var(--berry);font-variant-numeric:tabular-nums}
.places b{font-weight:560;font-size:19px;letter-spacing:-.02em}
.places small{display:block;color:var(--muted);font-size:14.5px}
.places .v{font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* waitlist */
.join{display:grid;gap:10px;width:min(540px,100%)}
/* .join .row{display:flex;border:1px solid var(--blue);background:var(--white)} */
.join .row{display:flex;border:.5px solid var(--blue);background:var(--white);border-radius:6px;overflow:hidden}
.join .field{flex:1;min-width:0;position:relative;display:flex}
.join input{flex:1;min-width:0;border:0;background:none;padding:13px 14px;font-size:16px}
/* the placeholder, with a gap where the snail lands and becomes the @ */
.hint{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;color:#7C9AA3;pointer-events:none;display:flex;align-items:center;white-space:nowrap}
.hint .at{display:inline-block;width:26px;height:1em}
.field.typed .hint{visibility:hidden}
.join input:focus{outline:none}
.join small{font-size:14px;color:var(--muted)}
.join .btn[aria-busy]{cursor:progress}

/* loading: the @ from the logo draws itself round its spiral, rubs out, and goes again while slowly turning */
.swirl{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.25em}
.swirl svg{width:100%;height:100%;display:block;overflow:visible}
.swirl path{fill:none;stroke:currentColor;stroke-width:40;stroke-linecap:round;stroke-linejoin:round}
.swirl .ghost{opacity:.18}
.swirl .ink{stroke-dasharray:1 1.2;animation:swirl-draw 1.8s cubic-bezier(.65,0,.35,1) infinite}
.swirl g{transform-origin:476px 240px;animation:swirl-turn 3.6s linear infinite}
@keyframes swirl-draw{from{stroke-dashoffset:1.1}to{stroke-dashoffset:-1.1}}
@keyframes swirl-turn{to{transform:rotate(360deg)}}
/* while the logo picture loads, the swirl waits where the @ will be drawn */
.logo-wait{position:relative;aspect-ratio:862/356;color:var(--orange)}
.logo-wait .swirl{position:absolute;left:42.7%;top:33.7%;width:26.9%;height:auto;aspect-ratio:232/240}
@media (prefers-reduced-motion:reduce){.swirl g{animation:none}.swirl .ink{animation-duration:4s}}
@media (max-width:520px){.join .row{flex-direction:column}.join .btn{width:100%}}
footer .in{padding-block:30px 44px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
footer .daypick{order:-1;flex-basis:100%;width:auto;justify-items:center;text-align:center;margin-bottom:16px}
footer .daypick{display:none}   /* time-of-day picker hidden for now; delete this line to bring it back */


/* ---------- the world: the ground, the light and the time of day ---------- */
body{background:var(--ground,var(--tea));transition:background-color .6s}
.w-ground,.w-air{transition:opacity .6s}
/* the words sit on a soft pool of the ground colour, so the moss and stones never get in the way of reading */
.idea>*:not(.strip):not(.places):not(.join),.cap{text-shadow:0 0 18px var(--ground,var(--tea)),0 0 6px var(--ground,var(--tea))}
/* night: moonlit ground, pale words */
html.w-night{--blue:#D7ECF2;--muted:#9FC0C2;--berry:#F1A9D6;--line:#35514A;--lav:#2B3542;--orange:#F59A5E}
html.w-night .btn{color:#0B2A36}
html.w-night .btn:hover{background:#F1A9D6}
html.w-night .join .row{color:#0B4F6C}
html.w-night .stage .slot{background:#323D4C;border-color:#56637A}
html.w-night .skip{color:#0B4F6C}
/* time-of-day preview */
.daypick{display:grid;gap:8px;width:min(380px,100%);font-size:13.5px;color:var(--muted)}
.daypick output{color:var(--blue);font-weight:500;font-variant-numeric:tabular-nums}
.daybtns{display:flex;flex-wrap:wrap;gap:6px}
.daybtns button{font-size:13px;font-weight:500;border:1.5px solid var(--blue);background:transparent;color:var(--blue);padding:6px 10px;cursor:pointer;touch-action:manipulation}
.daybtns button[aria-pressed="true"]{background:var(--blue);color:var(--ground,var(--tea))}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.intro-logo,.intro{transition:none}}

/* one screen when it fits; on short screens it grows and scrolls instead of squashing sections together */
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
main{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(16px,3vh,32px);padding-block:8px}
main>section{width:100%}
main>.idea{min-height:0;padding-block:0;gap:clamp(16px,4vh,28px)}
.idea h2,.hero h1{font-size:clamp(36px,min(9.5vw,13vh),150)}
.idea h2.long{font-size:clamp(28px,min(7vw,8vh),92px)}

/* spacing: caps line / headline / body / email box */
main{justify-content:flex-start;gap:clamp(24px,4vh,30px)}
main>.hero{gap:0;margin-top:auto}      /* centers when there's room, never pushes up under the logo */
main>#join{margin-bottom:auto}
.hero .kick{margin-bottom:clamp(20px,8vh,50px)}   /* caps line → headline */
.hero h1{padding-bottom:0;margin-bottom:clamp(40px,1.6vh,60px)}

</style>
<noscript><style>.intro,.skip{display:none}.hlogo{visibility:visible}</style></noscript>
</head>
<body>

<div class="intro" id="intro"><div class="intro-logo" id="introLogo"></div></div>
<button class="skip" id="skip" type="button">Skip</button>

<header><div class="in"><img class="hlogo" id="hlogo" src="img/wordmark.png" alt="Snale"></div></header>

<main id="main">
  <!-- the boil: a tiny wobble that changes every frame, like a drawing redone by hand for each frame -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="boil" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence id="boilNoise" type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
  <svg class="trail" id="trail" aria-hidden="true"><path id="tPath"/><g id="dabs"></g></svg>
  <img class="crawler" id="crawler" src="img/snail.png" alt="">

  <section class="in idea hero"> 
    <span class="kick">A SOCIAL MEDIA PLATFORM FOR REAL-LIFE ARTISTS</span>
    <h1 class="zoom">On the way.</h1>
    <p>Snale is made by creatives for creatives to get back to what they do best: creating. There's no endless feed, no addictive algorithm, and nothing made by machines.</p>
  </section>

    <section class="in idea" id="join">
    <div class="join" id="joinBox"></div>
  </section>
  <div hidden><div class="mapzoom" id="mapzoom"><div class="frame"><svg id="town"></svg><span class="dist" id="dist"></span></div><div class="cap" id="cap"></div></div><div id="strip"></div></div>


</main>
<footer><div class="in"><span>© 2026 Snale.</span><div class="daypick"><span>The light follows your clock: <output id="dayOut"></output></span><div class="daybtns" id="dayBtns" role="group" aria-label="Preview a time of day"></div></div></div></footer>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp=v=>Math.min(1,Math.max(0,v)), ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

  // ---------- the logo draws itself ----------
  const AT_PATH='M494 206 C470 190,440 200,432 232 C424 262,446 276,466 262 C482 250,490 228,494 208 C496 232,498 252,512 258 C536 266,552 236,548 206 C542 160,500 144,466 148 C420 152,394 190,396 236 C398 290,420 330,470 334 C512 336,544 312,572 302';
  const SWIRL=`<span class="swirl" role="img" aria-label="Loading"><svg viewBox="368 120 232 240" aria-hidden="true"><g><path class="ghost" d="${AT_PATH}"/><path class="ink" pathLength="1" d="${AT_PATH}"/></g></svg></span>`;
  const LOGO_PARTS={head:[[262,0,294,140],[338,140,218,110],[352,250,226,106]],n:[[148,0,114,356],[262,140,76,110],[262,250,90,106]],L:[[556,0,126,250],[578,250,134,106]],s:[[0,0,148,356]],e:[[682,0,180,250],[712,250,150,106]]};
  const LOGO_LETTERS=[['n',1.85],['L',1.97],['s',2.12],['e',2.24]];
  function mountLogo(host, done){
    const W=862, H=356, P=new Path2D(AT_PATH);
    const sv=document.createElementNS('http://www.w3.org/2000/svg','svg'), pe=document.createElementNS('http://www.w3.org/2000/svg','path');
    sv.setAttribute('style','position:absolute;width:0;height:0'); pe.setAttribute('d',AT_PATH); sv.appendChild(pe); document.body.appendChild(sv); const LEN=pe.getTotalLength();
    const PTS=[]; for(let s=0;s<=LEN;s+=2){ const q=pe.getPointAtLength(s); PTS.push([q.x,q.y,s]); } sv.remove();
    const cv=document.createElement('canvas'); cv.className='logo-draw'; cv.setAttribute('role','img'); cv.setAttribute('aria-label','Snale'); cv.width=W; cv.height=H;
    host.innerHTML=`<div class="logo-wait">${SWIRL}</div>`;   // until the picture arrives
    const inout=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, out=t=>1-Math.pow(1-t,3), back=t=>1+2.2*Math.pow(t-1,3)+1.2*Math.pow(t-1,2);
    const pen=c=>{ c.lineWidth=46; c.lineCap='round'; c.lineJoin='round'; c.strokeStyle='#fff'; };
    const layer=()=>{ const c=document.createElement('canvas'); c.width=W; c.height=H; return c; };
    const img=new Image(); img.src='img/wordmark.png';
    img.onload=()=>{
      host.replaceChildren(cv);
      const bc=layer().getContext('2d'); bc.drawImage(img,0,0);
      let A; try{ A=bc.getImageData(0,0,W,H).data; }catch(e){ cv.getContext('2d').drawImage(img,0,0); done(); return; }
      const KEYS=['shell','head','n','L','s','e'], N=W*H, owner=new Uint8Array(N), seen=new Uint8Array(N);
      const vote=(x,y)=>{ for(const k in LOGO_PARTS) for(const [rx,ry,rw,rh] of LOGO_PARTS[k]) if(x>=rx&&x<rx+rw&&y>=ry&&y<ry+rh) return k; return 's'; };
      for(let i=0;i<N;i++){ if(seen[i]||!A[i*4+3]) continue;
        const ink=[i], votes={}; seen[i]=1;
        for(let j=0;j<ink.length;j++){ const p=ink[j], x=p%W, y=(p-x)/W, k=vote(x,y); votes[k]=(votes[k]||0)+1;
          for(const q of [x>0?p-1:-1, x<W-1?p+1:-1, y>0?p-W:-1, y<H-1?p+W:-1]) if(q>=0&&!seen[q]&&A[q*4+3]){ seen[q]=1; ink.push(q); } }
        const k=Object.keys(votes).reduce((a,b)=>votes[a]>=votes[b]?a:b);
        for(const p of ink){ const x=p%W, y=(p-x)/W; owner[p]=KEYS.indexOf(k==='L'||k==='e' ? (x<682||y>256+(x-682)*.08 ? 'L' : 'e') : k); } }
      const mc=layer().getContext('2d'); pen(mc); mc.lineWidth=96; mc.stroke(P); const M=mc.getImageData(0,0,W,H).data;
      const shell=[];
      for(let p=0;p<N;p++) if(owner[p]===1 && M[p*4+3]>127){ owner[p]=0;
        const x=p%W, y=(p-x)/W; let best=1e9, s=0; for(const [px,py,ps] of PTS){ const dd=(px-x)*(px-x)+(py-y)*(py-y); if(dd<best){ best=dd; s=ps; } } shell.push([s,p]); }
      shell.sort((a,b)=>a[0]-b[0]);
      const part={}; KEYS.forEach((k,id)=>{ if(!id) return; const d=new ImageData(W,H);
        for(let p=0;p<N;p++) if(owner[p]===id && A[p*4+3]){ const o=p*4; d.data[o]=A[o]; d.data[o+1]=A[o+1]; d.data[o+2]=A[o+2]; d.data[o+3]=A[o+3]; }
        const c=layer(); c.getContext('2d').putImageData(d,0,0); part[k]=c; });
      const at=layer(), ac=at.getContext('2d'), sd=new ImageData(W,H); let drawn=0;
      const t0=performance.now(), speed=still?3:1;
      const frame=now=>{
        if(!cv.isConnected) return;
        const t=(now-t0)/1000*speed;
        const dpr=Math.min(3,window.devicePixelRatio||1), cw=Math.round((cv.clientWidth||W)*dpr);
        if(cv.width!==cw){ cv.width=cw; cv.height=Math.round(cw*H/W); }
        const c=cv.getContext('2d'), sc=cv.width/W; c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,cv.width,cv.height); c.setTransform(sc,0,0,sc,0,0);
        const d=inout(clamp((t-.25)/1.3))*LEN;
        if(drawn<shell.length && shell[drawn][0]<=d){
          while(drawn<shell.length && shell[drawn][0]<=d){ const o=shell[drawn++][1]*4; for(let b=0;b<4;b++) sd.data[o+b]=A[o+b]; }
          ac.putImageData(sd,0,0); }
        if(drawn) c.drawImage(at,0,0);
        const h=out(clamp((t-1.3)/.7));
        if(h>0){ const top=H-h*H; c.save(); c.beginPath(); c.rect(0,top,W,H); c.clip(); c.drawImage(part.head,0,still?0:(1-h)*26); c.restore(); }
        for(const [k,start] of LOGO_LETTERS){ const q=clamp((t-start)/.6); if(q<=0) continue;
          c.globalAlpha=out(q); c.drawImage(part[k],0,still?0:(1-back(q))*22); c.globalAlpha=1; }
        if(t<3.1) requestAnimationFrame(frame); else done();
      };
      requestAnimationFrame(frame);
    };
  }

  // ---------- the opening: draw, hold a moment, then shrink into the header ----------
  const intro=$('#intro'), il=$('#introLogo'), hl=$('#hlogo');
  let finished=false;
  document.body.classList.add('intro-on');
  function land(){
    if(finished) return; finished=true;
    const a=il.getBoundingClientRect(), b=hl.getBoundingClientRect();
    il.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${b.width/a.width})`;
    intro.classList.add('leaving'); $('#skip').remove();
    setTimeout(()=>{ hl.classList.add('on'); intro.remove(); document.body.classList.remove('intro-on'); $('#crawler').classList.add('on'); build(); }, still?0:1200);
  }
  mountLogo(il, ()=>setTimeout(land, still?0:500));
  setTimeout(land, 6000);   // never leave someone stuck on the opening
  $('#skip').addEventListener('click', land);

  // ---------- waitlist ----------
  const jb=$('#joinBox');
  jb.innerHTML=`<form novalidate style="display:grid;gap:10px"><div class="row"><label for="em" style="position:absolute;left:-9999px">Email address</label><span class="field"><input type="email" id="em" aria-label="Email address" autocomplete="email" maxlength="254"><span class="hint" id="hint" aria-hidden="true">example<span class="at" id="atSpot"></span>email.com</span></span><button class="btn" type="submit">Join the waitlist</button></div><small>We'll let you know when Snale arrives.</small></form>`;
  jb.querySelector('form').addEventListener('submit',e=>{ e.preventDefault(); const v=$('#em').value.trim(), s=jb.querySelector('small');
    if(v.length>254||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ s.textContent='Enter an email address like name@example.com.'; s.style.color='var(--berry)'; return; }
    const b=jb.querySelector('.btn'); if(b.hasAttribute('aria-busy')) return;
    b.setAttribute('aria-busy','true'); b.innerHTML=`${SWIRL} Joining`;
    fetch('https://docs.google.com/forms/d/e/1FAIpQLSffUoyS842b5xN0CezWZ2m1syUydVoSymKMfokbD4h2itdgiQ/formResponse',{
      method:'POST', mode:'no-cors',
      body:new URLSearchParams({'entry.1223247247':v})
    }).then(()=>{
      // the address is added as text, never as HTML

<script>

        if(!sh){ c.strokeStyle='rgba(255,255,255,.5)'; c.lineWidth=.8; for(let j=0;j<3;j++){ const an=j*2.094; c.beginPath(); c.arc(Math.cos(an)*4*s,Math.sin(an)*4*s,2*s,an+2.5,an+3.8); c.stroke(); } } break;
      case 'grass': { c.rotate(-it.rot); c.lineCap='round';
        for(let j=0;j<it.blades;j++){ const bx=(j-it.blades/2)*2.4*s, h=(11+((j*7)%5)*2.2)*s, lean=(j-it.blades/2)*1.6*s+Math.sin(t*.0012+it.sway+j)*(still?0:1.8)*s;
          c.strokeStyle=sh||(j%2?'#86BF6A':'#9ACE7C'); c.lineWidth=1.8*s; c.beginPath(); c.moveTo(bx,0); c.quadraticCurveTo(bx+lean*.3,-h*.6,bx+lean,-h); c.stroke(); } break; }
      case 'flower': c.fillStyle=sh||it.c; for(let j=0;j<5;j++){ const an=j*1.2566; c.beginPath(); c.arc(Math.cos(an)*3.3*s,Math.sin(an)*3.3*s,2.6*s,0,7); c.fill(); }
        if(!sh){ c.fillStyle='#F6C64C'; c.beginPath(); c.arc(0,0,1.9*s,0,7); c.fill(); } break;
    }
    c.restore();
  }
  function drawGround(t){
    g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle=L.ground; g.fillRect(0,0,W,H);
    const sy=scrollY, night=L.height<=0;
    // the sun throws shadows away from itself; low sun, long shadows
    const ang=L.angle*Math.PI/180, len=night?1.2:1.5+(1-L.height)*7;
    shadow={dx:-Math.cos(ang)*len, dy:Math.max(.8,Math.sin(ang)*len*.35+1.2), len};
    g.save(); g.translate(0,-sy);
    const vis=items.filter(it=>it.y>sy-40 && it.y<sy+H+40);
    // shadows first, all together, so they overlap softly
    g.save(); g.translate(shadow.dx,shadow.dy); g.globalAlpha=night?.18:.16+(1-L.height)*.1;
    for(const it of vis) shapes(g,it,t,'#3D5A3A'); g.restore();
    for(const it of vis) shapes(g,it,t,null);
    g.restore();
    // the light over everything: multiplied, so day stays clear and the evening turns gold
    g.globalCompositeOperation='multiply'; g.fillStyle=L.tint; g.fillRect(0,0,W,H); g.globalCompositeOperation='source-over';
  }
  // ---------- light through the leaves, and fireflies at night ----------
  const spots=Array.from({length:9},(_,i)=>({x:(i*0.37)%1,y:(i*0.61)%1,r:.18+((i*13)%7)/30,p:i*1.7}));
  const flies=Array.from({length:14},(_,i)=>({x:(i*0.29+.05)%1,y:(i*0.47+.1)%1,p:i*2.3}));
  function drawAir(t){
    a.setTransform(dpr,0,0,dpr,0,0); a.clearRect(0,0,W,H);
    const night=L.height<=0, k=still?0:t/1000, R=Math.max(W,H);
    a.globalCompositeOperation=night?'source-over':'soft-light';
    for(const s of spots){
      const x=(s.x+Math.sin(k*.05+s.p)*.06)*W, y=(s.y+Math.cos(k*.04+s.p)*.05)*H, r=s.r*R*.55;
      const gr=a.createRadialGradient(x,y,0,x,y,r); const al=L.strength*(.7+.3*Math.sin(k*.3+s.p));
      gr.addColorStop(0, night?`rgba(160,185,220,${al*.35})`:L.dapple); gr.addColorStop(1,'rgba(255,255,255,0)');
      a.globalAlpha=night?1:al*2.2; a.fillStyle=gr; a.fillRect(x-r,y-r,2*r,2*r);
    }
    a.globalAlpha=1; a.globalCompositeOperation='source-over';
    if(night) for(const f of flies){
      const x=(f.x+Math.sin(k*.11+f.p)*.04)*W, y=(f.y+Math.cos(k*.09+f.p*1.3)*.05)*H, on=.5+.5*Math.sin(k*1.3+f.p*3);
      const gr=a.createRadialGradient(x,y,0,x,y,10); gr.addColorStop(0,`rgba(246,230,140,${.75*on})`); gr.addColorStop(1,'rgba(246,230,140,0)');
      a.fillStyle=gr; a.fillRect(x-10,y-10,20,20);
    }
  }

  // ---------- time ----------
  let preview=780;
  const PH=[[T(5,50),'Dawn'],[T(8),'Morning'],[T(11,30),'Midday'],[T(15),'Afternoon'],[T(17,30),'Golden hour'],[T(19),'Sunset'],[T(20,30),'Dusk'],[T(21,40),'Night']];
  const phase=m=>{ if(m<T(5,50)) return 'Night'; let n='Night'; for(const [s,x] of PH) if(m>=s) n=x; return n; };
  const nowMin=()=>{ const d=new Date(); return d.getHours()*60+d.getMinutes(); };
  function setTime(){
    const m=preview ?? nowMin(); L=light(m);
    root.dataset.daylight=phase(m); root.classList.toggle('w-night', isNight(m));
    root.style.setProperty('--ground', L.ground);
    dirty=true;
    document.dispatchEvent(new CustomEvent('daylight',{detail:{minute:m,phase:phase(m),preview:preview!==null}}));
  }
  window.snaleDaylight={ set(m){ preview=m; setTime(); }, phase, now:nowMin };

  // ---------- loop: the air drifts all the time; the ground redraws when you scroll, or ~20 times a second for the grass ----------
  let lastY=-1, lastG=0;
  function frame(t){
    if(builtFor===0 || scrollY!==lastY || dirty || (!still && t-lastG>50)){ scatter(); drawGround(t); lastY=scrollY; lastG=t; dirty=false; }
    drawAir(t);
    requestAnimationFrame(frame);
  }
  size(); setTime(); addEventListener('resize',()=>{ size(); builtFor=-1; });
  addEventListener('load',()=>{ builtFor=-1; dirty=true; });
  // setInterval(()=>{ if(preview===null) setTime(); },60000);
  requestAnimationFrame(frame);
})();

// ---------- the time-of-day preview ----------
(function(){
  const box=document.getElementById('dayBtns'), out=document.getElementById('dayOut');
  if(!box) return;
  const T=(h,m)=>h*60+(m||0);
  const PICKS=[['Now',null],['Dawn',T(6,30)],['Midday',T(13)],['Golden hour',T(18)],['Sunset',T(19,30)],['Dusk',T(21)],['Night',T(23)]];
  const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  box.innerHTML=PICKS.map(([n,m],i)=>`<button type="button" data-i="${i}" aria-pressed="${m===null}">${n}</button>`).join('');
  box.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
    box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    snaleDaylight.set(PICKS[+b.dataset.i][1]); });
  document.addEventListener('daylight', e=>{ const {minute,phase,preview}=e.detail; out.textContent=(preview?'':'now ')+fmt(minute)+', '+phase.toLowerCase(); });
  snaleDaylight.set(780);
})();
</script>
</body>
